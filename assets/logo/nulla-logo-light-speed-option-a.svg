<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">NULLA light speed logo option A</title>
  <desc id="description">A restrained black and white logo using a moon arc, light-speed line, and geometric NULLA wordmark.</desc>
  <!-- 功能目的：定义黑白品牌画布；实现原因：保证在深色航天语境中具备稳定识别度 -->
  <rect width="1024" height="1024" fill="#050505"/>

  <!-- 功能目的：表达月球轨道；实现原因：用极细弧线保留 Artemis 参考图的克制航天感 -->
  <circle cx="512" cy="388" r="178" fill="none" stroke="#f7f7f2" stroke-width="14"/>
  <path d="M386 262 A178 178 0 0 1 638 514" fill="none" stroke="#050505" stroke-width="56" stroke-linecap="round"/>

  <!-- 功能目的：表达光与速度；实现原因：水平切线比具象火箭更简洁且适合小尺寸使用 -->
  <path d="M236 392 H668" fill="none" stroke="#f7f7f2" stroke-width="18" stroke-linecap="square"/>
  <path d="M676 392 L786 338 L734 392 L786 446 Z" fill="#f7f7f2"/>
  <path d="M212 340 H400" fill="none" stroke="#f7f7f2" stroke-width="10" stroke-linecap="square" opacity=".78"/>
  <path d="M182 448 H454" fill="none" stroke="#f7f7f2" stroke-width="10" stroke-linecap="square" opacity=".56"/>
  <path d="M256 504 H356" fill="none" stroke="#f7f7f2" stroke-width="8" stroke-linecap="square" opacity=".42"/>

  <!-- 功能目的：形成字母 N 的负形暗示；实现原因：让图形标与 NULLA 品牌建立直接关系 -->
  <path d="M462 284 V494 H498 V360 L566 494 H604 V284 H568 V418 L500 284 Z" fill="#050505"/>

  <!-- 功能目的：提供主标文字；实现原因：宽字距呼应参考图中 Artemis 的冷静科技感 -->
  <g fill="#f7f7f2" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="512" y="730" font-size="104" font-weight="700" letter-spacing="38">NULLA</text>
    <text x="512" y="796" font-size="28" font-weight="400" letter-spacing="12">LIGHT SPEED</text>
  </g>
</svg>
